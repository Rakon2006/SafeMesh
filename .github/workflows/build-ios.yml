name: Build iOS (SafeMesh)

on:
  push:
    branches: [ main ]
    paths:
      - 'frontend/**'
      - '.github/workflows/build-ios.yml'
  workflow_dispatch:

jobs:
  build-ios:
    name: Build SafeMesh iOS App
    runs-on: macos-14

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web Application
        working-directory: frontend
        run: npm run build

      - name: Copy Web Assets to iOS Project
        working-directory: frontend
        run: npx @capacitor/cli copy ios

      - name: Verify Xcode Version
        run: |
          xcodebuild -version

      - name: Build iOS App via xcodebuild
        working-directory: frontend/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package App for Distribution
        working-directory: frontend/ios/App/build/Build/Products/Release-iphoneos
        run: |
          mkdir -p Payload
          cp -R App.app Payload/
          zip -r SafeMesh-iOS-Release.zip Payload App.app

      - name: Upload iOS Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SafeMesh-iOS-Release
          path: frontend/ios/App/build/Build/Products/Release-iphoneos/SafeMesh-iOS-Release.zip
          retention-days: 14
